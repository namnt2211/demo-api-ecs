version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demoapi
      POSTGRES_USER: demoapi_admin
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: demoapi
      DB_USERNAME: demoapi_admin
      DB_PASSWORD: changeme
      DB_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data:
